# Worker（Claude の中継。D-02 C12、A-03 G29）。配備先は利用者の Cloudflare アカウント。
# 秘密情報はここに書かない。次の二つは Cloudflare 側で設定する（wrangler secret put / ダッシュボード）:
#   ANTHROPIC_API_KEY  ... Claude の API キー（Secrets）
#   ALLOWED_ORIGIN     ... ブラウザの接続元（例: アプリの URL）。平文の変数でもよい
name = "claude-aided-design-relay"
main = "src/worker/index.ts"
compatibility_date = "2026-10-01"

# アプリ（npm run build の dist）も、同じ Worker から配る（B）。アプリと判定の受け口が同じ場所になる。
[assets]
directory = "./dist"
binding = "ASSETS"

# マスタ（G49）の D1。利用者の Cloudflare に作った空のデータベース（cad-masters）。表の中身はまだ入れていない。
[[d1_databases]]
binding = "cad_masters"
database_name = "cad-masters"
database_id = "4229d9cf-52c5-4ced-8ca1-f33be92e4fe5"

# 費用の月上限（D-06 N7）。今月の判定の件数を数える KV（2026-11-08 作成、代表の決定で上限 1,000 件）。
# 別の Cloudflare アカウントに配備するときは、自分で KV を作って id を書き換える。
[[kv_namespaces]]
binding = "USAGE"
id = "a48d5d25e1e84bc4b74c81f96abf794d"

[vars]
MONTHLY_CLASSIFY_LIMIT = "1000"
# 接続元の制限（D-06 N6）。本番のアプリの URL 以外から Claude の中継を呼ばせない。URL は秘密ではない。
# 別の Cloudflare アカウントに配備するときは、自分の Worker の URL に書き換える。
ALLOWED_ORIGIN = "https://claude-aided-design-relay.ishikawa-yutaka.workers.dev"
